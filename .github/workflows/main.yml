
name: Build Arisan Spin APK v1.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Periksa ZIP
      - name: Check project ZIP
        run: |
          echo "Checking project archive..."
          ls -lh
          test -f Arisan-Spin-Android-Project-v1.1.zip

      # 3. Extract project
      - name: Extract Android project
        run: |
          unzip -q Arisan-Spin-Android-Project-v1.1.zip
          echo "Project extracted"
          ls -la arisan-spin-android
          test -f arisan-spin-android/settings.gradle.kts
          test -f arisan-spin-android/app/build.gradle.kts

      # 4. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 5. Setup Gradle
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 6. Verify Java and Kotlin targets
      - name: Verify JVM configuration
        run: |
          grep -n "sourceCompatibility" arisan-spin-android/app/build.gradle.kts
          grep -n "targetCompatibility" arisan-spin-android/app/build.gradle.kts
          grep -n "jvmTarget" arisan-spin-android/app/build.gradle.kts

      # 7. Build APK
      - name: Build Android APK
        run: |
          gradle \
            -p arisan-spin-android \
            --no-daemon \
            :app:assembleDebug

      # 8. Verify APK
      - name: Verify APK file
        run: |
          APK="arisan-spin-android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      # 9. Upload APK
      - name: Upload Arisan Spin APK v1.1
        uses: actions/upload-artifact@v4
        with:
          name: Arisan-Spin-APK-v1.1
          path: arisan-spin-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
