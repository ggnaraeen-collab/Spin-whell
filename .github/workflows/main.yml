
name: Build Spin Doorprize APK v1.2

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Spin Doorprize Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q Spin-Doorprize-Android-Project-v1.2.1.zip
          test -f spin-doorprize-android/settings.gradle.kts
          test -f spin-doorprize-android/app/build.gradle.kts

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle -p spin-doorprize-android \
            --no-daemon \
            :app:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p output
          cp spin-doorprize-android/app/build/outputs/apk/debug/app-debug.apk \
            output/Spin-Doorprize-v1.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Spin-Doorprize-APK-v1.2
          path: output/Spin-Doorprize-v1.2.apk
          if-no-files-found: error
          retention-days: 7
