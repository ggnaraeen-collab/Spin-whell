name: Build Arisan Spin APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -q Arisan-Spin-Android-Project.zip

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Java Kotlin compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("arisan-spin-android/app/build.gradle.kts")
          s = p.read_text()

          marker = "    targetSdk = 35\n"

          addition = """    targetSdk = 35

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          """

          if "compileOptions" not in s:
              if marker not in s:
                  raise SystemExit("targetSdk marker not found")
              s = s.replace(marker, addition, 1)

          p.write_text(s)
          print("Java and Kotlin targets set to 17")
          PY

      - name: Build Android APK
        run: |
          gradle -p arisan-spin-android --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Arisan-Spin-APK
          path: arisan-spin-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
